services:
  - type: web
    name: nineveh-api
    runtime: node
    plan: free
    region: oregon
    rootDir: nineveh-gifted-school/server
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://nineveh-gifted-web.vercel.app
