services:
  - type: web
    name: nineveh-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: nineveh-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: CLIENT_URL
        value: "https://nineveh-gifted.vercel.app"

databases:
  - name: nineveh-db
    databaseName: nineveh_gifted_school
    user: nineveh_user
    plan: free
    region: oregon