<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <clipPath id="outerClip">
      <circle cx="150" cy="150" r="145"/>
    </clipPath>
  </defs>
  
  <!-- Outer gray circle -->
  <circle cx="150" cy="150" r="145" fill="#b0b0b0"/>
  
  <!-- White inner circle -->
  <circle cx="150" cy="150" r="130" fill="white"/>
  
  <!-- Teal arc decorations - top -->
  <path d="M70,150 A80,80 0 0,1 230,150" fill="none" stroke="#1a9e96" stroke-width="28" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Gray arc decorations - bottom -->
  <path d="M230,150 A80,80 0 0,1 70,150" fill="none" stroke="#9e9e9e" stroke-width="28" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Brain outline - outer -->
  <path d="M150,80 C120,80 90,100 90,130 C90,145 95,155 105,162 C100,170 100,185 115,195 C130,205 145,200 150,195 C155,200 170,205 185,195 C200,185 200,170 195,162 C205,155 210,145 210,130 C210,100 180,80 150,80Z" 
        fill="white" stroke="#1a9e96" stroke-width="3"/>
  
  <!-- Brain folds - left -->
  <path d="M120,100 C105,115 100,135 105,150" fill="none" stroke="#1a9e96" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M130,90 C110,110 108,140 115,160" fill="none" stroke="#1a9e96" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M140,85 C125,105 120,135 125,155" fill="none" stroke="#1a9e96" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Brain folds - right -->
  <path d="M180,100 C195,115 200,135 195,150" fill="none" stroke="#1a9e96" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M170,90 C190,110 192,140 185,160" fill="none" stroke="#1a9e96" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M160,85 C175,105 180,135 175,155" fill="none" stroke="#1a9e96" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Center stem -->
  <line x1="150" y1="100" x2="150" y2="175" stroke="#1a9e96" stroke-width="3"/>
  
  <!-- Circuit nodes -->
  <circle cx="150" cy="100" r="6" fill="#1a9e96"/>
  <circle cx="150" cy="120" r="5" fill="#1a9e96"/>
  <circle cx="150" cy="140" r="5" fill="#1a9e96"/>
  <circle cx="150" cy="160" r="5" fill="#1a9e96"/>
  <circle cx="150" cy="175" r="6" fill="#1a9e96"/>
  
  <!-- Circuit branches -->
  <line x1="150" y1="100" x2="125" y2="110" stroke="#1a9e96" stroke-width="2"/>
  <line x1="150" y1="100" x2="175" y2="110" stroke="#1a9e96" stroke-width="2"/>
  <line x1="150" y1="120" x2="120" y2="130" stroke="#1a9e96" stroke-width="2"/>
  <line x1="150" y1="120" x2="180" y2="130" stroke="#1a9e96" stroke-width="2"/>
  <line x1="150" y1="140" x2="125" y2="150" stroke="#1a9e96" stroke-width="2"/>
  <line x1="150" y1="140" x2="175" y2="150" stroke="#1a9e96" stroke-width="2"/>
  <line x1="150" y1="160" x2="130" y2="168" stroke="#1a9e96" stroke-width="2"/>
  <line x1="150" y1="160" x2="170" y2="168" stroke="#1a9e96" stroke-width="2"/>
  
  <!-- Branch end circles -->
  <circle cx="125" cy="110" r="3" fill="#1a9e96"/>
  <circle cx="175" cy="110" r="3" fill="#1a9e96"/>
  <circle cx="120" cy="130" r="3" fill="#1a9e96"/>
  <circle cx="180" cy="130" r="3" fill="#1a9e96"/>
  <circle cx="125" cy="150" r="3" fill="#1a9e96"/>
  <circle cx="175" cy="150" r="3" fill="#1a9e96"/>
  <circle cx="130" cy="168" r="3" fill="#1a9e96"/>
  <circle cx="170" cy="168" r="3" fill="#1a9e96"/>
  
  <!-- Top text -弧形 -->
  <path id="topArc" d="M50,150 A100,100 0 0,1 250,150" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a9e96">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">صياغة رعاية الموهوبين</textPath>
  </text>
  
  <!-- Bottom text -->
  <path id="bottomArc" d="M55,160 A95,95 0 0,0 245,160" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a9e96">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">مدرسة الموهوبين - نينوى</textPath>
  </text>
  
  <!-- Year -->
  <text x="150" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a9e96">٢٠٢٥</text>
</svg>
