version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nineveh-db
    environment:
      POSTGRES_DB: nineveh_gifted_school
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nineveh-network

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nineveh-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-secure_password_123}@postgres:5432/nineveh_gifted_school?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars-change-in-production}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:8080
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nineveh-network
    restart: unless-stopped

  # Frontend (Nginx + React)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nineveh-web
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - nineveh-network
    restart: unless-stopped

  # Prisma Studio (optional - for database management)
  prisma-studio:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nineveh-prisma
    command: npx prisma studio --hostname 0.0.0.0 --port 5555
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-secure_password_123}@postgres:5432/nineveh_gifted_school?schema=public
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nineveh-network
    profiles:
      - tools

volumes:
  postgres_data:

networks:
  nineveh-network:
    driver: bridge